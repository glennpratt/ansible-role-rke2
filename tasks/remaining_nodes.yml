---

- name: Create the RKE2 config dir
  ansible.builtin.file:
    state: directory
    path: /etc/rancher/rke2
    owner: root
    group: root
    mode: 0755

- name: Set server taints
  ansible.builtin.set_fact:
    combined_node_taints: "{{ rke2_server_node_taints }}"
  when: rke2_type == 'server'

- name: Set agent taints
  ansible.builtin.set_fact:
    combined_node_taints: "{{ rke2_agent_node_taints }}"
  when: rke2_type == 'agent'

- name: Copy RKE2 config
  ansible.builtin.template:
    src: "{{ rke2_config }}"
    dest: /etc/rancher/rke2/config.yaml
    owner: root
    group: root
    mode: 0600
  notify: "Config file changed"

- name: Copy Containerd Registry Configuration file
  ansible.builtin.template:
    src: "{{ rke2_custom_registry_path }}"
    dest: /etc/rancher/rke2/registries.yaml
    owner: root
    group: root
    mode: 0600
  when: (rke2_custom_registry_mirrors | length > 0 or rke2_custom_registry_configs | length > 0)
  notify: "Config file changed"

- name: Start RKE2 service on the rest of the nodes
  ansible.builtin.systemd:
    name: "{{ rke2_service_name }}"
    state: started
    enabled: true
  retries: 10
  delay: 3
  register: result
  until: result is not failed
  environment:
    RKE2_TOKEN: "{{ rke2_token }}"
  notify: "Service (re)started"

- name: Mask other RKE2 service on the rest of the nodes
  ansible.builtin.systemd:
    name: "rke2-{{ item }}.service"
    enabled: false
    masked: true
  with_items:
    - "{{ (['agent', 'server'] | reject('match', rke2_type) | list) }}"

- name: Wait for remaining nodes to be ready - no CNI
  ansible.builtin.shell: |
    {{ rke2_data_path }}/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get node "{{ item }}" -o jsonpath='{range .status.conditions[*]}{.message}{"\n"}{end}'
  args:
    executable: /bin/bash
  changed_when: false
  register: node_status
  until:
    - '"kubelet has sufficient memory available"  in node_status.stdout_lines'
    - '"kubelet has no disk pressure"  in node_status.stdout_lines'
    - '"kubelet has sufficient PID available"  in node_status.stdout_lines'
    - ('"cni plugin not initialized" in node_status.stdout' or '"kubelet is posting ready status." in node_status.stdout')
  retries: 100
  delay: 15
  # ansible_play_hosts (not groups[rke2_cluster_group_name]) so that a host
  # which already failed/was excluded earlier in this run (e.g. a transient
  # SSH connectivity failure caught by an earlier any_errors_fatal play) isn't
  # looped over here -- groups[] is the static inventory membership and never
  # shrinks, so looping over it would wait forever for a node that will never
  # join.
  loop: "{{ ansible_play_hosts }}"
  when:
    - rke2_cni == 'none'
    - inventory_hostname == active_server or inventory_hostname == groups[rke2_servers_group_name].0

- name: Wait for remaining nodes to be ready - with CNI
  ansible.builtin.shell: |
    set -o pipefail
    {{ rke2_data_path }}/bin/kubectl --kubeconfig /etc/rancher/rke2/rke2.yaml get nodes | grep " Ready" | wc -l
  args:
    executable: /bin/bash
  changed_when: false
  register: all_ready_nodes
  until:
    # ansible_play_hosts (not groups[rke2_cluster_group_name]) so this compares
    # against the number of hosts still actually participating in the run.
    # groups[] is the static inventory membership: it never shrinks even when
    # a host legitimately failed/was excluded earlier in the run (e.g. a
    # transient SSH connectivity failure caught by an earlier any_errors_fatal
    # play), so using it here would wait forever comparing "ready" against a
    # node count that can never be reached.
    "ansible_play_hosts | length == all_ready_nodes.stdout | int"
  retries: 100
  delay: 15
  when:
    - rke2_cni != 'none'
    - inventory_hostname == active_server or inventory_hostname == groups[rke2_servers_group_name].0

# The two waits above are only performed by one observer host (the active
# server), but with the linear strategy every host in this play -- including
# the ones that skipped those waits -- only reaches this task after the
# observer's wait has already succeeded for the whole cluster. So it's safe
# for every host to clear its own flags here. Only do so for hosts that
# weren't already bootstrapped before this run: those are genuinely joining
# for the first time, so any rke2_restart_needed raised by this same
# first-time config/version templating isn't a separate restart still owed.
# Already-established hosts going through this file again (e.g. during a
# routine config change or upgrade) keep their real restart-needed signal so
# the orchestrated "Rolling RKE2 restart" play still picks them up.
- name: Clear restart-needed flags for nodes joining for the first time
  ansible.builtin.set_fact:
    rke2_restart_needed: false
    rke2_version_changed: false
  when: not (rke2_already_bootstrapped | default(false))
